name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-installers:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend deps
        run: npm ci

      - name: Fetch Ollama runtime (macOS)
        if: matrix.platform == 'macos-latest'
        run: bash scripts/fetch-ollama.sh

      - name: Fetch Ollama runtime (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/fetch-ollama.ps1

      - name: Build app & publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AI 공지 도우미 ${{ github.ref_name }}'
          releaseBody: |
            아래 Assets에서 설치파일을 받으세요.
            - macOS: `.dmg`
            - Windows: `.exe`

            별도 설치 없이 바로 사용할 수 있습니다. 최초 1회 실행 시 AI 모델(약 9.6GB)을 자동 다운로드하며, 이후에는 오프라인으로 동작합니다.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
